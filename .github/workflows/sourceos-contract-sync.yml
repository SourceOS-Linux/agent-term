name: SourceOS Contract Sync

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/agent_term/contracts/sourceos/generated/sourceos_interaction_event.py"
      - "tools/sync_sourceos_contracts.py"
      - ".github/workflows/sourceos-contract-sync.yml"
  push:
    branches: ["main", "work/sourceos-contract-sync"]
    paths:
      - "src/agent_term/contracts/sourceos/generated/sourceos_interaction_event.py"
      - "tools/sync_sourceos_contracts.py"
      - ".github/workflows/sourceos-contract-sync.yml"

permissions:
  contents: read

jobs:
  check-sourceos-contract-sync:
    name: Check SourceOS contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check vendored SourceOS contracts
        run: python tools/sync_sourceos_contracts.py --check
